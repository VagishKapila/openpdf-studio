name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: node scripts/build.mjs

      # Build unsigned DMG.
      # To enable code signing + notarization later, add these repo secrets:
      #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_ID,
      #   APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      # and switch the mac build config to hardenedRuntime:true, notarize:true,
      # identity: (unset). See commit history for the signing-ready workflow.
      - name: Build Mac DMG (unsigned)
        run: npx electron-builder --mac dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip auto-discovery so local dev certs on runner aren't picked up
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocPix-Studio-Mac
          path: release/*.dmg

      - name: Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
